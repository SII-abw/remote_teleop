[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evo-remote-teleop"
version = "0.2.0"
description = "Safety-gated remote teleoperation and human-in-the-loop recording"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3", "websockets>=14,<17", "numpy>=1.26,<3"]

[project.optional-dependencies]
cloud = []
master = ["evo-remote-teleop[media]"]
slave = ["evo-remote-teleop[media,dataset,recording]"]
policy = ["opencv-python>=4.10,<5", "msgpack>=1,<2", "torch>=2.2.1,<2.8"]
serial = ["pyserial>=3.5,<4", "feetech-servo-sdk>=1,<2", "deepdiff>=7,<9", "tqdm>=4.66,<5", "draccus==0.10.0"]
recording = [
  "datasets>=4.0,<4.2", "huggingface-hub>=0.34.2,<0.36", "pandas>=2.2,<2.4",
  "pillow>=10,<13", "packaging>=24.2,<26", "torch>=2.2.1,<2.8",
  "torchvision>=0.21,<0.23", "pyarrow>=18,<25", "av>=15,<16", "fsspec>=2023.1",
]
media = ["opencv-python>=4.10,<5", "aiortc>=1.14,<2", "av>=15,<17"]
dataset = ["pyarrow>=18,<25"]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.9"]

[project.scripts]
remote-teleop = "remote_teleop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
remote_teleop = ["web/*", "components/datasets/card_template.md"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
